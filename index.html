<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Megatheshwaran R | Java Full Stack Developer & IoT Systems Engineer</title>
  <meta name="description" content="Super 3D Portfolio of Megatheshwaran R — Java Full Stack Developer specializing in Core Java, Spring Boot, REST APIs, Java Servlets/JSP, MySQL, and connected IoT telemetry architectures. 2024 B.E. ECE graduate ready for immediate joining.">
  <meta name="keywords" content="Megatheshwaran R, Java Full Stack Developer, 3D Portfolio, Spring Boot, Junior Java Developer, MySQL, Servlets, JSP, REST API, IoT, ESP8266, MQTT, MATLAB, React 18, Three.js">

  <link rel="icon" type="image/png" href="assets/megatheshwaran_logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Cyber Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- High-Speed React 18 & ReactDOM 18 (Cloudflare CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (Cloudflare CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>

  <!-- Centralized Portfolio Data -->
  <script src="data/portfolioData.js"></script>
</head>
<body>

  <!-- React Mounting Root -->
  <div id="root">
    <!-- Sleek Cyber Loading Fallback -->
    <div class="cyber-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #030712; color: #00f0ff; font-family: 'IBM Plex Mono', monospace; text-align: center; padding: 20px;">
      <div style="width: 50px; height: 50px; border: 3px solid rgba(0, 240, 255, 0.2); border-top-color: #00f0ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
      <div id="loader-status" style="font-size: 0.9rem; letter-spacing: 0.15em; text-transform: uppercase;">INITIALIZING 3D REACT CORE...</div>
    </div>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </div>

  <!-- Watchdog fallback in case of slow CDN connection -->
  <script>
    setTimeout(function() {
      var statusEl = document.getElementById('loader-status');
      if (statusEl && document.querySelector('.cyber-loader')) {
        statusEl.innerHTML = 'Connecting to 3D WebGL Engine... <br><br><button onclick="location.reload()" style="background:#00f0ff;color:#000;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-family:monospace;font-weight:bold;">Tap to Refresh</button>';
      }
    }, 4500);
  </script>

  <!-- React 18 Super 3D Application -->
  <script type="text/babel" data-presets="react" src="react-app.js"></script>

</body>
</html>
